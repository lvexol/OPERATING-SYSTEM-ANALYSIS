<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Skull cranium -->
  <path d="M32 4 C16 4 8 14 8 26 C8 34 12 40 18 44 L18 52 C18 54 20 56 22 56 L42 56 C44 56 46 54 46 52 L46 44 C52 40 56 34 56 26 C56 14 48 4 32 4 Z"
        fill="#cc0000" stroke="#ff0000" stroke-width="1.5"/>
  <!-- Left eye socket - angular/evil -->
  <polygon points="18,20 26,16 30,24 24,28 16,26"
           fill="#0a0a0a"/>
  <!-- Left eye glow -->
  <polygon points="20,21 25,18 28,24 22,27 17,25"
           fill="#ff2200" opacity="0.6"/>
  <!-- Right eye socket - angular/evil -->
  <polygon points="46,20 38,16 34,24 40,28 48,26"
           fill="#0a0a0a"/>
  <!-- Right eye glow -->
  <polygon points="44,21 39,18 36,24 42,27 47,25"
           fill="#ff2200" opacity="0.6"/>
  <!-- Nose cavity -->
  <polygon points="32,32 29,38 35,38"
           fill="#0a0a0a"/>
  <!-- Teeth row -->
  <rect x="20" y="50" width="5" height="6" rx="0" fill="#0a0a0a"/>
  <rect x="27" y="50" width="5" height="6" rx="0" fill="#0a0a0a"/>
  <rect x="34" y="50" width="5" height="6" rx="0" fill="#0a0a0a"/>
  <!-- Jaw outline -->
  <line x1="18" y1="50" x2="46" y2="50" stroke="#ff0000" stroke-width="1.5"/>
  <!-- Cracks for evil effect -->
  <polyline points="28,10 26,18 30,22" stroke="#ff4400" stroke-width="1" fill="none" opacity="0.7"/>
  <polyline points="36,8 38,16 34,20" stroke="#ff4400" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Shine effect -->
  <ellipse cx="26" cy="12" rx="6" ry="4" fill="white" opacity="0.08"/>
</svg>
