server:
    extension:
        customhook:
            enable: false
            name: 'Custom Hook Points with iFrame Impersonation'
            hooks:
                changeme:
                    path: "/changeme"
                    target: "http://example.com"
                    title: "Change Me!"
                server:
                    path: "/server"
                    target: "http://serverproject.com"
                    title: "Server - The Browser Exploitation Framework Project"
                yougotchipmunked:
                    path: "/yougotchipmunked"
                    target: "http://www.chipmunks.com"
                    title: "Alvin and the Chipmunks.."
