server:
    module:
        spoof_addressbar_data:
            enable: false
            category: "Social Engineering"
            name: "Spoof Address Bar (data URL)"
            description: "This module redirects the browser to a legitimate looking URL with a ''data'' scheme, such as ''data:text/html,http://victim.com'', with a Server hook and a user-specified URL in a 100% x 100% iframe."
            authors: ["bcoles"]
            target:
                user_notify: ["O", "FF", "C"]
                not_working: ["IE"]
